<!DOCTYPE html>
<html class="h-full" data-kt-theme="true" data-kt-theme-mode="light" dir="ltr" lang="en">
<head>
    <base href="">
    <meta charset="utf-8" />
    <title>SutureNote</title>
    <link href="../assets/css/app.css" rel="stylesheet" />
    <link href="../assets/vendors/keenicons/styles.bundle.css" rel="stylesheet" />
    <link href="../assets/vendors/toastr/toastr.css" rel="stylesheet">
    <script src="../assets/vendors/jquery/jquery.min.js"></script>
    <script src="../assets/vendors/toastr/toastr.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/common_script.js"></script>
    <script src="../assets/js/include_html.js"></script>
    <script src="../assets/js/status.js"></script>
</head>
<body class="font-poppins antialiased flex h-full text-base text-foreground bg-background demo1 kt-header-fixed background-color">
    <!-- Page -->
    <!-- Main -->
    <div class="flex grow">
        <!-- Page -->
        <div id="header_menu"></div>
        <!-- Page -->
        <!-- Wrapper -->
        <div class="kt-wrapper flex grow flex-col">
            <!--begin::Content-->
            <div class="flex flex-col lg:flex-row grow padding-block" id="kt_content">
                <!-- Status List Table -->
                <!-- <div class="grid gap-5 lg:gap-7.5"> -->
                    <div class="kt-card kt-card-grid min-w-full">
                        <div class="kt-card-header flex-wrap gap-2">
                            <div class="flex flex-wrap gap-2 lg:gap-5">
                                <div class="flex">
                                    <label class="kt-input">
                                        <i class="ki-filled ki-magnifier"></i>
                                        <input id="datatableSearch" placeholder="Search" type="text" value="">
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="kt-card-content">
                            <div class="kt-scrollable-x-auto">
                                <table class="kt-table table-auto kt-table-border" id="status_table">
                                    <thead>
                                        <tr>
                                            <th class="sortable" data-sort="recording_id">
                                                <span class="kt-table-col">
                                                    <span class="kt-table-col-label">RECORD ID</span>
                                                    <span class="kt-table-col-sort"></span>
                                                </span>
                                            </th>
                                            <th class="sortable" data-sort="recording_type">
                                                <span class="kt-table-col">
                                                    <span class="kt-table-col-label">AUDIO TYPE</span>
                                                    <span class="kt-table-col-sort"></span>
                                                </span>
                                            </th>
                                            <th class="sortable" data-sort="audio_file">
                                                <span class="kt-table-col">
                                                    <span class="kt-table-col-label">AUDIO FILE</span>
                                                    <span class="kt-table-col-sort"></span>
                                                </span>
                                            </th>
                                            <th class="sortable" data-sort="created_at">
                                                <span class="kt-table-col">
                                                    <span class="kt-table-col-label">TIME STAMP</span>
                                                    <span class="kt-table-col-sort"></span>
                                                </span>
                                            </th>
                                            <th class="sortable" data-sort="status" style="width: 400px !important;">
                                                <span class="kt-table-col">
                                                    <span class="kt-table-col-label">RECORD STATUS</span>
                                                    <span class="kt-table-col-sort"></span>
                                                </span>
                                            </th>
                                            <th class="sortable" data-sort="reason">
                                                <span class="kt-table-col">
                                                    <span class="kt-table-col-label">REASON</span>
                                                    <span class="kt-table-col-sort"></span>
                                                </span>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody id="tableBody">
                                        <tr>
                                            <td colspan="6" class="text-center p-3">
                                                <div class="loading-spinner"></div>
                                                Loading...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="kt-card-footer justify-center md:justify-between flex-col md:flex-row gap-5 text-secondary-foreground text-sm font-medium">
                                <div class="flex items-center gap-2 order-2 md:order-1">
                                    <span id="paginationInfo">Showing 0 of 0 entries</span>
                                </div>
                                <div class="flex items-center gap-4 order-1 md:order-2" id="paginationControls"></div>
                            </div>
                        </div>
                    </div>
                <!-- </div> -->
            <!--end::Content-->
            </div>
            <!-- FOOTER -->
            <div id="footer-container"></div>
        </div>
        <!-- End Wrapper -->
    </div>
    <script src="../assets/js/core.bundle.js"></script>
    <script src="../assets/vendors/ktui/ktui.min.js"></script>
</body>
</html>
